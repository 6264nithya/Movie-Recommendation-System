<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommendations</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url('https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
            max-height: 80vh;
            overflow-y: auto;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #333;
        }

        .movie {
            margin-bottom: 15px;
            padding: 10px;
            background: #fff;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }

        .movie img {
            width: 100px;
            height: 150px;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .movie a {
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
        }

        button {
            padding: 10px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Top 10 Movie Recommendations</h1>
        {% for movie in recommendations %}
            <div class="movie">
                <img src="{{ movie['Poster'] }}" alt="Movie Poster">
                <p><strong>{{ movie['Title'] }}</strong></p>
                <p>IMDB Score: {{ movie['IMDB Score'] }}</p>
                <p>Genre: {{ movie['Genre'] }}</p>
                <a href="{{ movie['Imdb Link'] }}" target="_blank">View on IMDb</a>
            </div>
        {% endfor %}
        <button onclick="goBack()">Go Back</button>
    </div>

    <script>
        function goBack() {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
