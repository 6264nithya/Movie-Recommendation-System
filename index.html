<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommendation System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80'); /* Movie-themed background image */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.9); /* Semi-transparent white background */
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 10px;
            font-size: 16px;
            color: #555;
        }

        select {
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            padding: 10px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .recommendations {
            margin-top: 20px;
            text-align: left;
        }

        .recommendations ul {
            list-style-type: none;
            padding: 0;
        }

        .recommendations li {
            padding: 10px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            margin-bottom: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Movie Recommendation System</h1>
        <form id="recommendation-form">
            <label for="genre">Select Genre:</label>
            <select id="genre" name="genre">
                <option value="action">Action</option>
                <option value="comedy">Comedy</option>
                <option value="drama">Drama</option>
                <option value="horror">Horror</option>
                <option value="sci-fi">Sci-Fi</option>
            </select>
            <button type="submit">Get Recommendations</button>
        </form>
        <div id="recommendations" class="recommendations">
            <!-- Recommendations will be displayed here -->
        </div>
    </div>

    <script>
        document.getElementById('recommendation-form').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const genre = document.getElementById('genre').value;
            const recommendations = getRecommendations(genre);
            
            displayRecommendations(recommendations);
        });

        function getRecommendations(genre) {
            // Mock data for recommendations based on genre
            const movies = {
                action: ['Movie A1', 'Movie A2', 'Movie A3'],
                comedy: ['Movie C1', 'Movie C2', 'Movie C3'],
                drama: ['Movie D1', 'Movie D2', 'Movie D3'],
                horror: ['Movie H1', 'Movie H2', 'Movie H3'],
                'sci-fi': ['Movie S1', 'Movie S2', 'Movie S3']
            };
            
            return movies[genre] || [];
        }

        function displayRecommendations(recommendations) {
            const recommendationsDiv = document.getElementById('recommendations');
            recommendationsDiv.innerHTML = '';
            
            if (recommendations.length === 0) {
                recommendationsDiv.innerHTML = '<p>No recommendations found for this genre.</p>';
                return;
            }
            
            const ul = document.createElement('ul');
            recommendations.forEach(movie => {
                const li = document.createElement('li');
                li.textContent = movie;
                ul.appendChild(li);
            });
            
            recommendationsDiv.appendChild(ul);
        }
    </script>
</body>
</html>
